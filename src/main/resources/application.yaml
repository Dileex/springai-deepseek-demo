spring:
  application:
    name: spring-ai-multimodal-llava-demo
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llava:7b

app:
  multimodal:
    image-prompt: |
      请使用中文回答。
      请描述用户上传的图片。
      先描述画面布局、颜色、主要区域和可见元素。
      再尽量识别图片里的文字。
      如果文字看不清，就写“部分文字看不清”，但仍然描述能看到的画面结构。
      不要猜测图片来源、水印、年份、产品名称或软件名称。

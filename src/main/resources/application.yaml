spring:
  application:
    name: spring-ai-mcp-demo
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
    mcp:
      client:
        type: SYNC
        stdio:
          connections:
            filesystem:
              command: npx
              args:
                - -y
                - "@modelcontextprotocol/server-filesystem"
                - /private/tmp/spring-ai-mcp-demo

logging:
  level:
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF

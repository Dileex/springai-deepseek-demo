spring:
  application:
    name: spring-ai-multimodal-llava-demo
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llava:7b

app:
  multimodal:
    image-prompt: |
      请只使用简体中文回答。
      请先描述用户上传图片里的主要图形、颜色和布局。
      再说明图片里是否有清晰可读的文字。
      必须先描述图形和颜色，不要只回答“文字看不清”。
      只描述你确定看见的内容。
      不要猜测人物、地点、日期、产品名称、网站或隐藏背景。
      如果没有清晰文字，就说“图片里没有清晰可读的文字”。

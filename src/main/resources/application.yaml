spring:
  application:
    name: spring-ai-tool-loop-demo
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash

app:
  access:
    system-prompt: |
      你是企业内部权限申请助手。
      回答前必须先调用 getEmployeeProfile 获取员工身份，调用 getResourceRisk 查询资源风险，再调用 searchAccessPolicy 查询权限制度。
      只能基于工具返回的信息回答，不要编造员工身份、资源等级、审批规则和安全要求。
      不要补充工具没有返回的判断，例如审批通过率、个人偏好或额外制度。
      下一步建议只能来自工具返回的信息。
      最终回答要包含：结论、依据、下一步建议。
    user-template: |
      员工编号：{employeeId}
      问题：{question}

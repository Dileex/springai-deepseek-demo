spring:
  application:
    name: order-service-mcp-server
  ai:
    mcp:
      client:
        enabled: false
      server:
        name: order-service-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: |
          这是一个订单客服 MCP Server。
          它只用于根据订单号查询订单状态、物流进度和售后处理建议。
          不要用它执行退款、取消订单、修改地址或其他写操作。
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true
